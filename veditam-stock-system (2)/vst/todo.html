<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-do List - Vedritam</title>
<script>(function(){try{var t=localStorage.getItem('v_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="style.css?v=11.1">
<link rel="stylesheet" href="theme.css?v=12.1">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .td-card{background:var(--v-elev);border:1px solid var(--v-border);border-radius:14px;padding:18px;color:var(--v-text)}
  .td-form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .td-form input[type="text"]{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--v-border);border-radius:10px;background:transparent;color:inherit;font:inherit}
  .td-tbl{width:100%;border-collapse:collapse;font-size:14px}
  .td-tbl th,.td-tbl td{padding:10px 8px;border-bottom:1px solid var(--v-border);text-align:left;vertical-align:middle}
  .td-tbl th{font-size:12px;color:var(--v-text-muted);text-transform:uppercase;letter-spacing:.03em}
  .td-tbl td.done{text-align:center;width:80px}
  .td-tbl input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--v-primary)}
  .td-empty{padding:20px;text-align:center;color:var(--v-text-muted)}
  .td-tbl td.done{text-align:center;width:110px}
  .td-check{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--v-border);background:transparent;color:transparent;cursor:pointer;border-radius:6px;font-size:14px;line-height:1;padding:0}
  .td-check:hover{border-color:#22C55E}
  .td-check.is-done{background:#22C55E;border-color:#22C55E;color:#fff}
  .td-del{border:1px solid var(--v-border);background:transparent;color:var(--v-text-muted);cursor:pointer;font:inherit;font-size:13px;padding:5px 12px;border-radius:8px}
  .td-del:hover{background:rgba(239,68,68,.14);border-color:#EF4444;color:#EF4444}
  .td-done .td-text{text-decoration:line-through;color:var(--v-text-muted)}
</style>
</head>
<body data-page="todo">
<main class="main-content">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px">
    <div>
      <h1 class="v-page-title">To-do list</h1>
      <p class="v-page-sub">Track tasks for yourself. Type a task and press Add task. Tick the box to mark it done, or Delete to remove it.</p>
    </div>
  </div>

  <div class="td-card">
    <form class="td-form" id="tdForm">
      <input type="text" id="tdInput" placeholder="What needs to be done?" maxlength="200" autocomplete="off">
      <button type="submit" id="tdAdd" class="v-btn" style="width:auto;padding:10px 18px">Add task</button>
    </form>
    <div id="tdWarn" style="display:none;margin-bottom:12px;padding:9px 12px;border-radius:9px;background:rgba(239,68,68,.12);border:1px solid #EF4444;color:#EF4444;font-size:13px">To-do controls could not start. Reload this page and try again.</div>

    <table class="td-tbl">
      <thead>
        <tr><th style="width:60px">#</th><th>Task</th><th style="width:180px">Added</th><th class="done">Done</th><th class="done">Delete</th></tr>
      </thead>
      <tbody id="tdBody">
        <tr><td colspan="5" class="td-empty">No tasks yet - add one above.</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div id="toast-container"></div>

<script src="app.js?v=11.0"></script>
<script src="avatars.js?v=1.0"></script>
<script src="sounds.js?v=1.0"></script>
<script src="shell.js?v=12.1"></script>
<script>
/* To-do logic is inlined on purpose: no extra file to load, so Add / Done /
   Delete keep working even if another script or a cached file fails. */
(function () {
  'use strict';
  function start() {
    var form = document.getElementById('tdForm');
    var input = document.getElementById('tdInput');
    var addButton = document.getElementById('tdAdd');
    var body = document.getElementById('tdBody');
    var warn = document.getElementById('tdWarn');
    if (!input || !body) { if (warn) warn.style.display = 'block'; return; }

    function key() {
      var u = 'guest';
      try { u = localStorage.getItem('v_username') || 'guest'; } catch (e) {}
      return 'v_todo_' + u;
    }
    function load() {
      try { var p = JSON.parse(localStorage.getItem(key()) || '[]'); return Array.isArray(p) ? p : []; }
      catch (e) { return []; }
    }
    function save(tasks) {
      try { localStorage.setItem(key(), JSON.stringify(tasks)); return true; }
      catch (e) {
        if (warn) { warn.textContent = 'Tasks cannot be saved. Allow site storage in your browser and try again.'; warn.style.display = 'block'; }
        return false;
      }
    }
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function render() {
      var tasks = load();
      if (!tasks.length) {
        body.innerHTML = '<tr><td colspan="5" class="td-empty">No tasks yet - add one above.</td></tr>';
        return;
      }
      body.innerHTML = tasks.map(function (t, i) {
        var id = esc(t.id), done = t.done === true;
        return '<tr data-id="' + id + '"' + (done ? ' class="td-done"' : '') + '>' +
          '<td>' + (i + 1) + '</td>' +
          '<td class="td-text">' + esc(t.text) + '</td>' +
          '<td style="color:var(--v-text-muted);font-size:12.5px">' + esc(t.added) + '</td>' +
          '<td class="done"><button type="button" title="Mark done" aria-pressed="' + (done ? 'true' : 'false') +
            '" class="td-check' + (done ? ' is-done' : '') + '" data-action="done" data-id="' + id + '">' +
            (done ? '&#10003;' : '') + '</button></td>' +
          '<td class="done"><button type="button" class="td-del" data-action="delete" data-id="' + id + '">Delete</button></td>' +
          '</tr>';
      }).join('');
    }

    function addTask(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      var text = (input.value || '').trim();
      if (!text) { input.focus(); return false; }
      var tasks = load();
      tasks.push({
        id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        text: text, done: false, added: new Date().toLocaleString()
      });
      if (!save(tasks)) return false;
      input.value = '';
      render();
      input.focus();
      return false;
    }

    function onBodyClick(e) {
      var el = e.target;
      var btn = null;
      while (el && el !== body) {
        if (el.getAttribute && el.getAttribute('data-action')) { btn = el; break; }
        el = el.parentNode;
      }
      if (!btn) return;
      e.preventDefault();
      var id = btn.getAttribute('data-id');
      var action = btn.getAttribute('data-action');
      var tasks = load();
      if (action === 'delete') {
        tasks = tasks.filter(function (t) { return String(t.id) !== String(id); });
      } else if (action === 'done') {
        tasks.forEach(function (t) { if (String(t.id) === String(id)) t.done = t.done !== true; });
      } else { return; }
      if (save(tasks)) render();
    }

    if (form) form.onsubmit = addTask;
    if (addButton) addButton.onclick = addTask;
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') addTask(e); });
    body.onclick = onBodyClick;
    render();
    if (warn) warn.style.display = 'none';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
}());
</script>
</body>
</html>
